
name: "Build pages"

on:
  push:
    branches:
      - main

env:
  RUBY_VERSION: 4.0.0
  NODE_VERSION: 22

jobs:
  pages:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{env.RUBY_VERSION}}
          bundler-cache: true
          cache-version: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{env.NODE_VERSION}}

      # The project pins Yarn 4 via the `packageManager` field in package.json,
      # which only the corepack shim honours.
      - name: "Enable Corepack"
        run: corepack enable

      - name: "Yarn install"
        run: |
          yarn install --immutable

      - name: "Build site"
        run: |
          export BRIDGETOWN_ENV=production
          bundle exec bridgetown deploy

      - name: "Fix assets paths"
        run: |
          mv ./output/_bridgetown/static ./output/assets
          find ./output/ -name '*.html' -exec sed -ie 's/_bridgetown\/static\//assets\//' {} \;
          find ./output/ -name '*.css' -exec sed -ie 's/_bridgetown\/static\//assets\//g' {} \;
          find ./output/ -name '*.js' -exec sed -ie 's/_bridgetown\/static\//assets\//' {} \;
          find ./output/ -name '*.htmle' -exec rm {} \;
          find ./output/ -name '*.csse' -exec rm {} \;
          find ./output/ -name '*.jse' -exec rm {} \;

      - name: Deploy to GitHub Pages
        if: success()
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: output
          keep_history: true
          fqdn: f64.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive site artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: output
