name: "Build pages"

on:
  push:
    branches:
      - main

env:
  RUBY_VERSION: 4.0.0
  NODE_VERSION: 22

jobs:
  pages:
    name: "Build"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{env.RUBY_VERSION}}
          bundler-cache: true
          cache-version: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{env.NODE_VERSION}}

      # The project pins Yarn 4 via the `packageManager` field in package.json,
      # which only the corepack shim honours.
      - name: "Enable Corepack"
        run: corepack enable

      - name: "Yarn install"
        run: |
          yarn install --immutable

      - name: "Build site"
        run: |
          export BRIDGETOWN_ENV=production
          bundle exec bridgetown deploy

      # GitHub Pages serves through Jekyll, which ignores underscore-prefixed
      # directories, so `_bridgetown/static` would 404 in production.
      - name: "Fix assets paths"
        run: |
          mv ./output/_bridgetown/static ./output/assets
          find ./output/ -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) \
            -exec sed -i 's|_bridgetown/static/|assets/|g' {} +

      # Cheap insurance: these three files are the entire discovery path for the
      # 30 event pages, and a silent template failure would drop them without
      # failing the build.
      - name: "Verify SEO artifacts"
        run: |
          set -e
          test -s ./output/sitemap.xml || { echo "::error::sitemap.xml missing or empty"; exit 1; }
          test -s ./output/robots.txt  || { echo "::error::robots.txt missing or empty"; exit 1; }
          urls=$(grep -c '<loc>' ./output/sitemap.xml)
          echo "sitemap.xml lists $urls URLs"
          test "$urls" -ge 30 || { echo "::error::sitemap.xml only has $urls URLs"; exit 1; }
          missing=$(grep -L 'rel="canonical"' $(find ./output -name '*.html') || true)
          test -z "$missing" || { echo "::error::pages without a canonical tag: $missing"; exit 1; }
          if find ./output -name '*.map' | grep -q .; then
            echo "::error::sourcemaps leaked into production"; exit 1
          fi

      # `force_orphan` replaces the branch contents on every deploy. The previous
      # action kept history and only ever added files, so anything deleted from
      # the site stayed live — `/no-bienal/` was still being served at HTTP 200
      # long after the page was unpublished, alongside ~40 MB of orphaned images
      # and ten stale asset bundles.
      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          cname: f64.io
          force_orphan: true

      - name: Archive site artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: output
